<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name – Portfolio</title>
  <meta name="description" content="Personal portfolio website with macOS-inspired design">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="apple">
        <img src="Image/AppleLogo.png" alt="Apple" width="20" height="20">
      </div>
      <nav class="menu">
        <a href="#" id="openWallpaper">Wallpaper</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
      </nav>
    </div>
    <div id="clock" role="timer" aria-live="off"></div>
  </header>

  <!-- Desktop Area -->
  <main class="desktop">
    <div class="desktop-icons">
      <!-- Chess.com -->
      <a href="https://chess.com" target="_blank" rel="noopener noreferrer" class="desktop-icon">
        <div class="icon-image">
          <img src="Image/ChessLogo.png" alt="Chess.com">
        </div>
        <span class="icon-label">Chess.com</span>
      </a>

      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/aldrich-bertram-tjuwondo-4877a72b2/" target="_blank" rel="noopener noreferrer" class="desktop-icon">
        <div class="icon-image linkedin">
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </div>
        <span class="icon-label">LinkedIn</span>
      </a>

      <!-- GitHub (example) -->
      <a href="https://github.com/Student135-Git" target="_blank" rel="noopener noreferrer" class="desktop-icon">
        <div class="icon-image github">
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
        </div>
        <span class="icon-label">GitHub</span>
      </a>

      <!-- Portfolio/Projects -->
      <a href="#" class="desktop-icon" id="projectsIcon">
        <div class="icon-image projects">
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
          </svg>
        </div>
        <span class="icon-label">Projects</span>
      </a>

      <!-- Email/Contact -->
      <a href="mailto:aldrichbt@gmail.com" class="desktop-icon">
        <div class="icon-image email">
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </div>
        <span class="icon-label">Email</span>
      </a>

      <!-- Resume/CV -->
      <a href="resume.pdf" target="_blank" class="desktop-icon">
        <div class="icon-image resume">
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
          </svg>
        </div>
        <span class="icon-label">Resume</span>
      </a>
    </div>
  </main>

  <!-- Dock -->
  <div class="dock-wrap">
    <nav class="dock" role="navigation" aria-label="Application dock">
      <a href="#" aria-label="Finder">
        <img src="Image/FinderOs.png" width="32" height="32" alt="">
      </a>
      <a href="#" aria-label="Terminal">
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f4bb.svg" width="32" height="32" alt="">
      </a>
      <a href="#" aria-label="Safari">
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f310.svg" width="32" height="32" alt="">
      </a>
      <a href="#" aria-label="Messages">
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f4ac.svg" width="32" height="32" alt="">
      </a>
    </nav>
  </div>

  <!-- Wallpaper Chooser Window -->
  <div class="overlay" id="wallpaperOverlay" aria-hidden="true">
    <div class="window" role="dialog" aria-modal="true" aria-labelledby="wallpaperTitle">
      <div class="window-bar">
        <div class="window-dots">
          <button class="dot red" id="closeWallpaper" aria-label="Close window"></button>
          <span class="dot yellow" aria-hidden="true"></span>
          <span class="dot green" aria-hidden="true"></span>
        </div>
        <div class="window-title" id="wallpaperTitle">Wallpaper</div>
        <div style="width:60px"></div>
      </div>

      <div class="window-content">
        <h1>Choose Wallpaper</h1>
        <p>Select a wallpaper to customize your desktop background</p>

        <div class="wallpaper-grid" id="wallpaperGrid">
          <div class="wallpaper-item" data-wall="Image/w1.jpg" tabindex="0" role="button" aria-label="Select wallpaper 1">
            <img src="Image/w1.jpg" alt="Gradient wallpaper with soft colors" loading="lazy">
            <span class="check" aria-hidden="true">✓</span>
          </div>

          <div class="wallpaper-item" data-wall="Image/w2.jpg" tabindex="0" role="button" aria-label="Select wallpaper 2">
            <img src="Image/w2.jpg" alt="Abstract geometric wallpaper" loading="lazy">
            <span class="check" aria-hidden="true">✓</span>
          </div>

          <div class="wallpaper-item" data-wall="Image/w3.jpg" tabindex="0" role="button" aria-label="Select wallpaper 3">
            <img src="Image/w3.jpg" alt="Colorful gradient wallpaper" loading="lazy">
            <span class="check" aria-hidden="true">✓</span>
          </div>

          <div class="wallpaper-item" data-wall="Image/w4.jpg" tabindex="0" role="button" aria-label="Select wallpaper 4">
            <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800" alt="Mountain landscape" loading="lazy">
            <span class="check" aria-hidden="true">✓</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
